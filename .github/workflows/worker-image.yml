# Builds the worker's image for Azure Container Apps, which runs linux/amd64, and publishes it
# to GitHub's container registry. Only the public repo builds it: the image is public, and its
# name is tied to that repo.
name: Worker image

on:
  push:
    branches: [main]
    paths:
      - "ingest/**"
      - ".github/workflows/worker-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.repository == 'MRndy1/figurequiz'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ingest
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/mrndy1/figurequiz-worker:latest
            ghcr.io/mrndy1/figurequiz-worker:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/MRndy1/figurequiz
          cache-from: type=gha
          cache-to: type=gha,mode=max

<!doctype html>
<html lang="en">
  <body style="margin:0;padding:32px 16px;background:#fcfcfa;color:#1a2238;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;">
    <div style="max-width:480px;margin:0 auto;">
      <p style="margin:0 0 28px;font-size:20px;font-weight:800;letter-spacing:-0.02em;">FigureQuiz</p>
      <h1 style="margin:0 0 12px;font-size:26px;line-height:1.15;letter-spacing:-0.02em;">Confirm your email address</h1>
      <p style="margin:0 0 28px;font-size:16px;line-height:1.5;">
        Open this link to confirm {{ .NewEmail }} and keep your FigureQuiz deck. Every question
        opens once you're signed in.
      </p>
      <p style="margin:0 0 28px;">
        <a
          href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email_change"
          style="display:inline-block;padding:14px 22px;border:1.5px solid #1a2238;border-radius:12px;background:#ffe15a;color:#1a2238;font-size:16px;font-weight:700;text-decoration:none;"
          >Confirm my email address</a
        >
      </p>
      <p style="margin:0;font-size:14px;line-height:1.5;color:#4f5872;">
        If you didn't ask for this, ignore this email.
      </p>
    </div>
  </body>
</html>

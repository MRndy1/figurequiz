[project]
name = "ingest"
version = "0.1.0"
description = "Document parsing, diagram detection, rendering and blanking worker"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pydantic>=2.14.1",
    "pymupdf>=1.28.2",
    "pytesseract>=0.3.13",
    "python-pptx>=1.0.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
